services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-wisdom:local
    container_name: devops-wisdom-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
