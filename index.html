<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>devops --quote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="crt">
    <div class="scanlines" aria-hidden="true"></div>

    <main class="terminal" role="main">
      <header class="titlebar">
        <div class="dots" aria-hidden="true">
          <span class="dot dot-r"></span>
          <span class="dot dot-y"></span>
          <span class="dot dot-g"></span>
        </div>
        <span class="titlebar-name">devops-wisdom — bash — 80×24</span>
      </header>

      <section class="screen" id="screen">
        <p class="line boot">
          Bienvenido a <strong>devops-wisdom</strong> v1.0
        </p>

        <p class="line boot dim">
          Base de datos de sabiduría cargada:
          <span id="phrase-count">0</span> entradas.
        </p>

        <p class="line boot dim">
          Escribe un comando o presiona el botón para continuar.
        </p>

        <p class="line prompt-line" id="output-anchor"></p>
      </section>

      <footer class="input-row">
        <span class="prompt">devops@aula:~$</span>

        <select id="category-filter" class="category-filter">
          <option value="Todas">Todas</option>
          <option value="Git">Git</option>
          <option value="DevOps">DevOps</option>
          <option value="CI/CD">CI/CD</option>
          <option value="Colaboración">Colaboración</option>
        </select>

        <button id="run-btn" class="run-btn" type="button">
          devops --quote
        </button>

        <span class="hint">
          o presiona <kbd>Enter</kbd>
        </span>
      </footer>
    </main>

    <p class="credit">
      Ejercicio práctico — Sesión: Git y Modelos de Trabajo · DOY0101 Ingeniería DevOps
    </p>
  </div>

  <script src="phrases.js"></script>
  <script src="script.js"></script>
</body>
</html>
